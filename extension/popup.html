<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0a66c2;
      color: white;
      border: none;
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #004182;
    }

    .description {
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
    }

    .status {
      font-size: 12px;
      margin-top: 10px;
      color: #0a66c2;
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>
  <h3 style="margin-top: 0; color: #0a66c2;">Job Bot</h3>
  <div class="description">
    Navigate to LinkedIn Jobs search with the "Easy Apply" filter active, then click below to start auto-applying.
  </div>
  <button id="start-btn">Start Auto Apply</button>
  <button id="stop-btn" style="display: none; background-color: #d11124;">Stop Applying</button>

  <div style="margin-top: 15px; border-top: 1px solid #e0e0e0; padding-top: 15px;">
    <button id="settings-btn" style="background-color: #f3f2ef; color: #666; font-weight: 500;">⚙️ Setup
      Profile</button>
  </div>

  <div id="status" class="status">Bot is running! Keep this tab open.</div>
  <script src="popup.js"></script>
</body>

</html>
